<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S&R Live Dashboard</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: #0c0d14; 
            color: #fff; 
            margin: 0; 
            padding: 10px; 
            box-sizing: border-box;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .header {
            text-align: center;
            padding: 10px 0 5px 0;
        }
        h2 { margin: 0; color: #00adb5; font-size: 22px; }
        .subtitle { color: #616e85; font-size: 12px; margin-top: 4px; }
        
        .selector-box {
            background: #161722;
            padding: 12px;
            border-radius: 8px;
            margin: 10px 0;
            border: 1px solid #2a2c3f;
        }
        label { font-size: 12px; color: #8491a3; font-weight: bold; display: block; margin-bottom: 6px; }
        select { 
            width: 100%; 
            padding: 10px; 
            background: #202234; 
            color: #fff; 
            border: 1px solid #363a54; 
            border-radius: 6px; 
            font-size: 15px; 
            outline: none;
        }

        .widget-viewport {
            width: 100%;
            flex-grow: 1;
            min-height: 450px;
            border-radius: 12px;
            overflow: hidden;
            background: #131722;
            border: 1px solid #2a2c3f;
            box-sizing: border-box;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div class="header">
        <h2>S&R Tracker</h2>
        <div class="subtitle">Live Technical Action View</div>
    </div>

    <div class="selector-box">
        <label for="tickerSelect">CHOOSE WATCHLIST TICKER:</label>
        <select id="tickerSelect" onchange="loadActiveWidget()">
            <optgroup label="Crypto Currencies">
                <option value="BINANCE:BTCUSDT">BTC - Bitcoin</option>
                <option value="BINANCE:ETHUSDT">ETH - Ethereum</option>
                <option value="BINANCE:SOLUSDT">SOL - Solana</option>
                <option value="BINANCE:ZECUSDT">ZEC - Zcash</option>
            </optgroup>
            <optgroup label="Core Equities & ETFs">
                <option value="NASDAQ:AAPL">AAPL - Apple</option>
                <option value="NASDAQ:NVDA">NVDA - Nvidia</option>
                <option value="NYSE:BA">BA - Boeing</option>
                <option value="NYSE:NKE">NIKE - Nike</option>
                <option value="AMEX:SPY">SPY - S&P 500 ETF</option>
            </optgroup>
            <optgroup label="Index Futures">
                <option value="CME_MINI:MES1!">MES - Micro E-mini S&P</option>
                <option value="CME_MINI:MNQ1!">MNQ - Micro E-mini Nasdaq</option>
            </optgroup>
        </select>
    </div>

    <div class="widget-viewport" id="terminalFrame">
        <!-- Secure iframe will generate inside here -->
    </div>

<script>
    function loadActiveWidget() {
        const symbol = encodeURIComponent(document.getElementById('tickerSelect').value);
        const container = document.getElementById('terminalFrame');
        
        // This targets the secure web player URL natively used by mobile devices to bypass script blocks
        const embedUrl = `https://tradingview.com{symbol}&interval=D&hidesidetoolbar=1&symboledit=0&saveimage=1&toolbarbg=f1f3f6&studies=%5B%22PivotPointsStandard%40tv-basicstudies%22%5D&theme=dark&style=1&timezone=Exchange&studies_overrides=%7B%7D&overrides=%7B%7D&enabled_features=%5B%5D&disabled_features=%5B%5D&locale=en`;
        
        container.innerHTML = `<iframe id="tradingview_live_chart" src="${embedUrl}" allowfullscreen></iframe>`;
    }

    // Boot app instantly
    loadActiveWidget();
</script>

</body>
</html>
