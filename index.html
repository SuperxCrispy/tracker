<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S&R Live Dashboard</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: #0c0d14; 
            color: #fff; 
            margin: 0; 
            padding: 10px; 
            box-sizing: border-box;
        }
        .header {
            text-align: center;
            padding: 15px 0 5px 0;
        }
        h2 { margin: 0; color: #00adb5; font-size: 22px; }
        .subtitle { color: #616e85; font-size: 12px; margin-top: 4px; }
        
        /* Watchlist Selector Styling */
        .selector-box {
            background: #161722;
            padding: 12px;
            border-radius: 8px;
            margin: 10px 0;
            border: 1px solid #2a2c3f;
        }
        label { font-size: 12px; color: #8491a3; font-weight: bold; display: block; margin-bottom: 6px; }
        select { 
            width: 100%; 
            padding: 10px; 
            background: #202234; 
            color: #fff; 
            border: 1px solid #363a54; 
            border-radius: 6px; 
            font-size: 15px; 
            outline: none;
        }

        /* Widget Workspace Viewport */
        .widget-viewport {
            width: 100%;
            height: calc(100vh - 160px);
            min-height: 480px;
            border-radius: 12px;
            overflow: hidden;
            background: #131722;
            border: 1px solid #2a2c3f;
            box-sizing: border-box;
        }
        .tradingview-widget-container {
            width: 100%;
            height: 100%;
        }
    </style>
    <!-- Pre-caching external core libraries to fix mobile initialization dropouts -->
    <script type="text/javascript" src="https://tradingview.com"></script>
</head>
<body>

    <div class="header">
        <h2>S&R Tracker</h2>
        <div class="subtitle">Live Technical Action View</div>
    </div>

    <div class="selector-box">
        <label for="tickerSelect">CHOOSE WATCHLIST TICKER:</label>
        <select id="tickerSelect" onchange="loadActiveWidget()">
            <optgroup label="Crypto Currencies">
                <option value="BINANCE:BTCUSDT">BTC - Bitcoin</option>
                <option value="BINANCE:ETHUSDT">ETH - Ethereum</option>
                <option value="BINANCE:SOLUSDT">SOL - Solana</option>
                <option value="BINANCE:ZECUSDT">ZEC - Zcash</option>
            </optgroup>
            <optgroup label="Core Equities & ETFs">
                <option value="NASDAQ:AAPL">AAPL - Apple</option>
                <option value="NASDAQ:NVDA">NVDA - Nvidia</option>
                <option value="NYSE:BA">BA - Boeing</option>
                <option value="NYSE:NKE">NIKE - Nike</option>
                <option value="AMEX:SPY">SPY - S&P 500 ETF</option>
            </optgroup>
            <optgroup label="Index Futures">
                <option value="CME_MINI:MES1!">MES - Micro E-mini S&P</option>
                <option value="CME_MINI:MNQ1!">MNQ - Micro E-mini Nasdaq</option>
            </optgroup>
        </select>
    </div>

    <!-- Live Stream Technical Terminal Window -->
    <div class="widget-viewport" id="terminalFrame">
        <div class="tradingview-widget-container">
            <div id="tradingview_live_chart" style="height:100%;"></div>
        </div>
    </div>

<script>
    function loadActiveWidget() {
        const symbol = document.getElementById('tickerSelect').value;
        const container = document.getElementById('terminalFrame');
        
        // Wipe old widget reference out of memory frame
        container.innerHTML = '<div class="tradingview-widget-container"><div id="tradingview_live_chart" style="height:100%;"></div></div>';
        
        // Instantly generate structural technical view layouts
        if (typeof TradingView !== 'undefined') {
            new TradingView.widget({
                "autosize": true,
                "symbol": symbol,
                "interval": "D",
                "timezone": "Etc/UTC",
                "theme": "dark",
                "style": "1",
                "locale": "en",
                "enable_publishing": false,
                "hide_side_toolbar": true,
                "allow_symbol_change": false,
                "container_id": "tradingview_live_chart",
                "studies": [
                    "PivotPointsStandard@tv-basicstudies"
                ]
            });
        }
    }

    // Double-fallback hook to ensure rendering works flawlessly even on slow load connections
    if (document.readyState === "complete" || document.readyState === "interactive") {
        setTimeout(loadActiveWidget, 100);
    } else {
        document.addEventListener("DOMContentLoaded", loadActiveWidget);
    }
</script>

</body>
</html>
