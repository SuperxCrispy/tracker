<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live S&R Tracker Terminal</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: #0c0d14; 
            color: #fff; 
            margin: 0; 
            padding: 10px; 
            box-sizing: border-box;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .header {
            text-align: center;
            padding: 10px 0 5px 0;
        }
        h2 { margin: 0; color: #00adb5; font-size: 22px; }
        .subtitle { color: #616e85; font-size: 12px; margin-top: 4px; }
        
        .selector-box {
            background: #161722;
            padding: 12px;
            border-radius: 8px;
            margin: 10px 0;
            border: 1px solid #2a2c3f;
        }
        label { font-size: 12px; color: #8491a3; font-weight: bold; display: block; margin-bottom: 6px; }
        select { 
            width: 100%; 
            padding: 10px; 
            background: #202234; 
            color: #fff; 
            border: 1px solid #363a54; 
            border-radius: 6px; 
            font-size: 15px; 
            outline: none;
        }

        .widget-viewport {
            width: 100%;
            flex-grow: 1;
            min-height: 460px;
            border-radius: 12px;
            overflow: hidden;
            background: #131722;
            border: 1px solid #2a2c3f;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <div class="header">
        <h2>S&R Tracker</h2>
        <div class="subtitle">Official Real-Time Technical Engine</div>
    </div>

    <div class="selector-box">
        <label for="tickerSelect">SELECT ACTIVE MONITOR TICKER:</label>
        <select id="tickerSelect" onchange="loadActiveWidget()">
            <optgroup label="Crypto Currencies">
                <option value="BINANCE:BTCUSDT">BTC - Bitcoin</option>
                <option value="BINANCE:ETHUSDT">ETH - Ethereum</option>
                <option value="BINANCE:SOLUSDT">SOL - Solana</option>
                <option value="BINANCE:ZECUSDT">ZEC - Zcash</option>
            </optgroup>
            <optgroup label="Core Equities & ETFs">
                <option value="NASDAQ:AAPL">AAPL - Apple</option>
                <option value="NASDAQ:NVDA">NVDA - Nvidia</option>
                <option value="NYSE:BA">BA - Boeing</option>
                <option value="NYSE:NKE">NIKE - Nike</option>
                <option value="AMEX:SPY">SPY - S&P 500 ETF</option>
            </optgroup>
            <optgroup label="Index Futures">
                <option value="CME_MINI:MES1!">MES - Micro E-mini S&P</option>
                <option value="CME_MINI:MNQ1!">MNQ - Micro E-mini Nasdaq</option>
            </optgroup>
        </select>
    </div>

    <!-- The exact workspace viewport area -->
    <div class="widget-viewport" id="terminalFrame"></div>

    <!-- Loads official core layout utilities dynamically -->
    <script type="text/javascript" src="https://tradingview.com"></script>

<script>
    function loadActiveWidget() {
        const symbol = document.getElementById('tickerSelect').value;
        const container = document.getElementById('terminalFrame');
        
        // Build clean native frame structure
        container.innerHTML = '<div id="tradingview_live_feed" style="height:100%; width:100%;"></div>';
        
        if (typeof TradingView !== 'undefined') {
            new TradingView.widget({
                "autosize": true,
                "symbol": symbol,
                "interval": "D",
                "timezone": "Etc/UTC",
                "theme": "dark",
                "style": "1",
                "locale": "en",
                "enable_publishing": false,
                "hide_side_toolbar": true,
                "allow_symbol_change": false,
                "container_id": "tradingview_live_feed",
                "calendar": false,
                // Injects standard technical lines directly via clean internal arrays
                "studies": [
                    "PivotPointsStandard@tv-basicstudies"
                ]
            });
        }
    }

    // Direct initialization hook
    window.onload = loadActiveWidget;
</script>

</body>
</html>
